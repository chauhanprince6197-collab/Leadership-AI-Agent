version: "3.9"

services:
  agent:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./documents:/app/documents:ro  # read-only mount for documents
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # allow time for model loading

volumes:
  chroma_data:
